<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Security Gateway - FreshMart</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/admin-login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    
    <div class="admin-login-header">
      <div class="admin-shield-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1>Fresh<span>Mart</span> Admin Portal</h1>
      <p>Secure Authorized Access Only</p>
    </div>

    <!-- Demo Credentials Helper -->
    <div class="demo-creds-box">
      <div class="demo-creds-text">
        Demo: <strong>admin@freshmart.com</strong> / <strong>admin123</strong>
      </div>
      <button type="button" class="btn-autofill-demo" onclick="autoFillDemoAdmin()">
        Auto-Fill
      </button>
    </div>

    <!-- Error Banner -->
    <div class="admin-error-box" id="adminErrorMsg"></div>

    <!-- Admin Login Form -->
    <form class="admin-login-form" id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      
      <div class="admin-form-group">
        <label for="adminEmail">Administrator Email</label>
        <div class="admin-input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="adminEmail" placeholder="admin@freshmart.com" required />
        </div>
      </div>

      <div class="admin-form-group">
        <label for="adminPassword">Master Password</label>
        <div class="admin-input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required />
        </div>
      </div>

      <div class="admin-form-group">
        <label for="adminPin">Security PIN (Optional: 9999)</label>
        <div class="admin-input-box">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="adminPin" maxlength="6" placeholder="4-digit Security PIN" />
        </div>
      </div>

      <button type="submit" class="btn-admin-submit" id="btnAdminLogin">
        <i class="fa-solid fa-lock-open"></i> Sign In to Admin Dashboard
      </button>

      <div class="admin-login-footer">
        Looking for the customer store? <a href="index.html">Back to FreshMart Store</a>
      </div>

    </form>

  </div>

  <script src="../javascript/admin-login.js"></script>
</body>
</html>
